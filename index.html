<style>
  html, body { margin:0; padding:0; background:#0f1620; }
  .ltq-app {
  --paper: #F1F3EF;
  --paper-card: #FFFFFF;
  --ink: #1E2A38;
  --ink-soft: #64748A;
  --ink-faint: #9AA6B2;
  --line: #DDE3DF;
  --line-strong: #C7CFC9;
  --revenue: #2F6F5E;
  --revenue-soft: #E3EFEA;
  --expense: #A6443D;
  --expense-soft: #F5E7E3;
  --gold: #B8863A;
  --gold-soft: #F3E9D3;
  --navy: #16212E;
  font-family: 'Inter', -apple-system, sans-serif;
  color: var(--ink);
  background: var(--paper);
  width: 100%;
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  box-shadow: 0 0 40px rgba(20,30,40,0.35);
}
.ltq-app * { box-sizing: border-box; }
.ltq-header {
  background: var(--navy);
  color: #F1F3EF;
  padding: 22px 20px 18px;
  position: sticky;
  top: 0;
  z-index: 20;
  border-bottom: 3px solid var(--gold);
}
.ltq-header-eyebrow {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #B7C4CE;
  margin: 0 0 2px;
}
.ltq-header-title {
  font-family: 'Fraunces', serif;
  font-size: 22px;
  font-weight: 600;
  margin: 0;
  letter-spacing: -0.01em;
}
.ltq-content {
  flex: 1;
  padding: 18px 16px 100px;
  overflow-y: auto;
}
.ltq-section-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin: 0 0 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.ltq-section-label::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line-strong);
}
.ltq-cards-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 18px;
}
.ltq-card {
  background: var(--paper-card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 14px 12px;
  position: relative;
}
.ltq-card-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-soft);
  margin: 0 0 6px;
}
.ltq-card-value {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 21px;
  font-weight: 600;
  margin: 0;
  letter-spacing: -0.02em;
}
.ltq-card-revenue { border-top: 3px solid var(--revenue); }
.ltq-card-revenue .ltq-card-value { color: var(--revenue); }
.ltq-card-expense { border-top: 3px solid var(--expense); }
.ltq-card-expense .ltq-card-value { color: var(--expense); }
.ltq-card-profit { border-top: 3px solid var(--gold); }
.ltq-card-profit .ltq-card-value { color: var(--navy); }
.ltq-chart-card {
  background: var(--paper-card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px 10px 12px;
  margin-bottom: 20px;
}
.ltq-chart-title {
  font-family: 'Fraunces', serif;
  font-size: 15px;
  font-weight: 600;
  margin: 0 0 8px 10px;
}
.ltq-chart-legend {
  display: flex;
  gap: 16px;
  margin: 2px 0 10px 10px;
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  color: var(--ink-soft);
  align-items: center;
}
.ltq-legend-dot {
  width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-right: 5px;
}
.ltq-btn {
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 13.5px;
  border: none;
  border-radius: 8px;
  padding: 11px 16px;
  cursor: pointer;
  display: inline-flex;

<div id="root"></div>
<script>
  // Registra um Service Worker simples para permitir instalação e uso offline
  // (só funciona quando o arquivo é aberto via http/https, ex: hospedado no GitHub Pages, Netlify, etc.)
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    var swCode = "self.addEventListener('install', function(e){ self.skipWaiting(); });" +
      "self.addEventListener('activate', function(e){ self.clients.claim(); });" +
      "self.addEventListener('fetch', function(e){ /* passthrough: cache não obrigatório para app de página única */ });";
    var swBlob = new Blob([swCode], { type: "application/javascript" });
    var swUrl = URL.createObjectURL(swBlob);
    navigator.serviceWorker.register(swUrl).catch(function () { /* ignora se não suportado */ });
  }
</script>
<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;
const STORAGE_KEY = "ltq-financeiro-registro";

const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const MESES_ABREV = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];

const DEFAULT_DATA = {
  categoriasReceita: ["Livros","Assessoria","Mentoria","Consultoria","Cursos Online","Palestras","Licenciamento","Royalties","Outros"],
  categoriasDespesa: ["Aluguel","Salários","FGTS","Marketing","Impostos","Fornecedores","Material de Escritório","Software/Licenças","Energia/Água","Internet/Telefone","Manutenção","Outros"],
  formasRecebimento: ["Dinheiro","Pix","Cartão de Crédito","Cartão de Débito","Boleto","Transferência"],
  formasPagamento: ["Dinheiro","Pix","Cartão de Crédito","Cartão de Débito","Boleto","Transferência"],
  receitas: [],
  despesas: [],
};

function todayISO() { return new Date().toISOString().slice(0, 10); }
function formatBRL(n) { return (Number(n) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
function formatDatePt(iso) { if (!iso) return ""; const [y,m,d] = iso.split("-"); return `${d}/${m}/${y}`; }
function monthIndexFromISO(iso) { if (!iso) return null; const p = iso.split("-"); return p.length < 2 ? null : parseInt(p[1],10) - 1; }
function uid() { return `${Date.now()}-${Math.random().toString(36).slice(2,8)}`; }
function addMonthsISO(iso, n) {
  const [y, m, d] = iso.split("-").map((x) => parseInt(x, 10));
  const total = (m - 1) + n;
  const targetY = y + Math.floor(total / 12);
  const targetM = ((total % 12) + 12) % 12; // 0-11
  const lastDay = new Date(targetY, targetM + 1, 0).getDate();
  const targetD = Math.min(d, lastDay);
  return `${targetY}-${String(targetM + 1).padStart(2, "0")}-${String(targetD).padStart(2, "0")}`;
}

/* ---------- ícones (SVG simples, sem dependência externa) ---------- */
function Icon({ children, size = 18, ...props }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
         strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
      {children}
    </svg>
  );
}
const IconDashboard = (p) => <Icon {...p}><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></Icon>;
const IconUp = (p) => <Icon {...p}><polyline points="3 17 9 11 13 15 21 6"/><polyline points="14 6 21 6 21 13"/></Icon>;
const IconDown = (p) => <Icon {...p}><polyline points="3 7 9 13 13 9 21 18"/><polyline points="14 18 21 18 21 11"/></Icon>;
const IconBars = (p) => <Icon {...p}><line x1="4" y1="20" x2="4" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="20" y1="20" x2="20" y2="14"/></Icon>;
const IconBook = (p) => <Icon {...p}><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 4.5V19.5"/></Icon>;
const IconFile = (p) => <Icon {...p}><path d="M6 2h9l5 5v15H6z"/><polyline points="15 2 15 7 20 7"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></Icon>;
const IconPlus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;
const IconTrash = (p) => <Icon {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></Icon>;
const IconWallet = (p) => <Icon {...p}><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></Icon>;
const IconX = (p) => <Icon {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Icon>;
const IconDownload = (p) => <Icon {...p}><path d="M12 3v12"/><polyline points="7 10 12 15 17 10"/><path d="M5 21h14"/></Icon>;

/* ---------- persistência local ---------- */
function useLtqData() {
  const [data, setData] = useState(DEFAULT_DATA);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) setData({ ...DEFAULT_DATA, ...JSON.parse(raw) });
    } catch (e) { /* mantém padrão */ }
    setLoaded(true);
  }, []);

  useEffect(() => {
    if (!loaded) return;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    catch (e) { console.error("Falha ao salvar dados:", e); }
  }, [data, loaded]);

  return [data, setData, loaded];
}

/* ---------- sincronização entre aparelhos (Firebase Realtime Database) ---------- */
const SYNC_URL_KEY = "ltq-sync-url";
const SYNC_CODE_KEY = "ltq-sync-code";

function useSyncConfig() {
  const [url, setUrlState] = useState("");
  const [code, setCodeState] = useState("");
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    try {
      setUrlState(localStorage.getItem(SYNC_URL_KEY) || "");
      setCodeState(localStorage.getItem(SYNC_CODE_KEY) || "");
    } catch (e) { /* ignora */ }
    setLoaded(true);
  }, []);

  function setUrl(v) {
    setUrlState(v);
    try { localStorage.setItem(SYNC_URL_KEY, v); } catch (e) { /* ignora */ }
  }
  function setCode(v) {
    setCodeState(v);
    try { localStorage.setItem(SYNC_CODE_KEY, v); } catch (e) { /* ignora */ }
  }
  return { url, code, setUrl, setCode, loaded };
}

function buildSyncUrl(config) {
  const base = config.url.trim().replace(/\/$/, "");
  const code = config.code.trim().replace(/[^a-zA-Z0-9_-]/g, "");
  return `${base}/ltq-financeiro-sync/${encodeURIComponent(code)}.json`;
}

function useCloudSync(data, setData, dataLoaded, config) {
  const [status, setStatus] = useState("off"); // off | syncing | synced | error
  const [lastSync, setLastSync] = useState(null);
  const pushTimer = useRef(null);
  const readyToPush = useRef(false);

  const enabled = !!(config.url && config.code);

  // puxa da nuvem sempre que a configuração muda (ou ao abrir o app)
  useEffect(() => {
    if (!enabled || !dataLoaded) return;
    readyToPush.current = false;
    setStatus("syncing");
    fetch(buildSyncUrl(config))
      .then((r) => r.json())
      .then((remote) => {
        if (remote && typeof remote === "object" && (remote.receitas || remote.despesas || remote.categoriasReceita)) {
          setData({ ...DEFAULT_DATA, ...remote });
        }
        readyToPush.current = true;
        setStatus("synced");
        setLastSync(new Date());
      })
      .catch(() => { readyToPush.current = true; setStatus("error"); });
  }, [enabled, config.url, config.code, dataLoaded]); // eslint-disable-line

  // envia pra nuvem quando os dados mudam (com um pequeno atraso)
  useEffect(() => {
    if (!enabled || !dataLoaded || !readyToPush.current) return;
    if (pushTimer.current) clearTimeout(pushTimer.current);
    pushTimer.current = setTimeout(() => {
      setStatus("syncing");
      fetch(buildSyncUrl(config), { method: "PUT", body: JSON.stringify(data) })
        .then(() => { setStatus("synced"); setLastSync(new Date()); })
        .catch(() => setStatus("error"));
    }, 1200);
    return () => clearTimeout(pushTimer.current);
  }, [data]); // eslint-disable-line

  function syncNow() {
    if (!enabled) return;
    setStatus("syncing");
    fetch(buildSyncUrl(config))
      .then((r) => r.json())
      .then((remote) => {
        if (remote && typeof remote === "object") setData({ ...DEFAULT_DATA, ...remote });
        setStatus("synced");
        setLastSync(new Date());
      })
      .catch(() => setStatus("error"));
  }

  return { status, lastSync, syncNow, enabled };
}

/* ---------- componentes menores ---------- */
function Card({ label, value, variant }) {
  return (
    <div className={`ltq-card ltq-card-${variant}`}>
      <p className="ltq-card-label">{label}</p>
      <p className="ltq-card-value">{formatBRL(value)}</p>
    </div>
  );
}

function EmptyState({ icon, text }) {
  return <div className="ltq-empty">{icon}<div>{text}</div></div>;
}

function MonthlyBarChart({ data }) {
  const max = Math.max(1, ...data.map((d) => Math.max(d.receitas, d.despesas)));
  const w = 380, h = 170, padL = 6, padB = 20, padT = 6;
  const groupW = (w - padL) / data.length;
  const barW = Math.min(9, groupW / 2.6);
  return (
    <svg viewBox={`0 0 ${w} ${h}`} width="100%" style={{ overflow: "visible" }}>
      {[0.25, 0.5, 0.75, 1].map((f) => (
        <line key={f} x1={padL} x2={w} y1={padT + (h - padT - padB) * (1 - f)} y2={padT + (h - padT - padB) * (1 - f)} stroke="#DDE3DF" strokeDasharray="2 4" />
      ))}
      {data.map((d, i) => {
        const cx = padL + groupW * i + groupW / 2;
        const rH = (d.receitas / max) * (h - padT - padB);
        const dH = (d.despesas / max) * (h - padT - padB);
        const base = h - padB;
        return (
          <g key={d.mes}>
            <rect x={cx - barW - 1} y={base - rH} width={barW} height={rH} fill="#2F6F5E" rx="1.5" />
            <rect x={cx + 1} y={base - dH} width={barW} height={dH} fill="#A6443D" rx="1.5" />
            <text x={cx} y={h - 4} fontSize="8" fontFamily="IBM Plex Mono" fill="#64748A" textAnchor="middle">{d.mesAbrev}</text>
          </g>
        );
      })}
    </svg>
  );
}

function EntryForm({ tipo, categorias, formas, onSubmit, onCancel }) {
  const [date, setDate] = useState(todayISO());
  const [categoria, setCategoria] = useState(categorias[0] || "");
  const [forma, setForma] = useState(formas[0] || "");
  const [descricao, setDescricao] = useState("");
  const [valor, setValor] = useState("");
  const [parcelado, setParcelado] = useState(false);
  const [parcelas, setParcelas] = useState(2);
  const [fixo, setFixo] = useState(false);
  const [mesesFixo, setMesesFixo] = useState(12);
  const isReceita = tipo === "receita";
  const isCartao = forma === "Cartão de Crédito";

  useEffect(() => {
    if (!isCartao && parcelado) setParcelado(false);
  }, [isCartao]); // eslint-disable-line

  function handleSubmit(e) {
    e.preventDefault();
    const v = parseFloat(String(valor).replace(",", "."));
    if (!date || !categoria || !forma || !v || v <= 0) return;
    const base = { date, category: categoria, method: forma, description: descricao.trim() || "Sem descrição", value: v };
    if (isCartao && parcelado && parcelas >= 2) {
      onSubmit(base, { parcelas: parseInt(parcelas, 10) });
    } else if (!isReceita && fixo && mesesFixo >= 1) {
      onSubmit(base, { fixo: parseInt(mesesFixo, 10) });
    } else {
      onSubmit(base, null);
    }
    setDescricao(""); setValor(""); setParcelado(false); setFixo(false);
  }

  return (
    <form className="ltq-form" onSubmit={handleSubmit}>
      <p className="ltq-form-title">{isReceita ? "Nova receita" : "Nova despesa"}</p>
      <div className="ltq-field-row">
        <div className="ltq-field">
          <label>Data</label>
          <input type="date" value={date} onChange={(e) => setDate(e.target.value)} required />
        </div>
        <div className="ltq-field">
          <label>Valor (R$){isCartao && parcelado ? " total" : ""}</label>
          <input type="number" step="0.01" min="0.01" placeholder="0,00" value={valor} onChange={(e) => setValor(e.target.value)} required />
        </div>
      </div>
      <div className="ltq-field">
        <label>Categoria</label>
        <select value={categoria} onChange={(e) => setCategoria(e.target.value)}>
          {categorias.map((c) => <option key={c} value={c}>{c}</option>)}
        </select>
      </div>
      <div className="ltq-field">
        <label>{isReceita ? "Forma de recebimento" : "Forma de pagamento"}</label>
        <select value={forma} onChange={(e) => setForma(e.target.value)}>
          {formas.map((f) => <option key={f} value={f}>{f}</option>)}
        </select>
      </div>
      <div className="ltq-field">
        <label>Descrição</label>
        <input type="text" placeholder="Ex: Venda avulsa, cliente XYZ..." value={descricao} onChange={(e) => setDescricao(e.target.value)} />
      </div>

      {isCartao && (
        <div className="ltq-field" style={{ background: "#FAFAF8", border: "1px dashed var(--line-strong)", borderRadius: 8, padding: 10 }}>
          <label style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer", marginBottom: parcelado ? 10 : 0 }}>
            <input type="checkbox" style={{ width: "auto" }} checked={parcelado} onChange={(e) => { setParcelado(e.target.checked); if (e.target.checked) setFixo(false); }} />
            <span style={{ textTransform: "none", fontSize: 12.5, letterSpacing: 0 }}>Compra parcelada no cartão</span>
          </label>
          {parcelado && (
            <>
              <label>Número de parcelas</label>
              <select value={parcelas} onChange={(e) => setParcelas(e.target.value)}>
                {Array.from({ length: 59 }, (_, i) => i + 2).map((n) => <option key={n} value={n}>{n}x</option>)}
              </select>
              <p style={{ fontSize: 11.5, color: "var(--ink-soft)", margin: "6px 0 0" }}>
                O valor informado é o total da compra. Será dividido em {parcelas}x e lançado automaticamente nos meses seguintes.
              </p>
            </>
          )}
        </div>
      )}

      {!isReceita && !isCartao && (
        <div className="ltq-field" style={{ background: "#FAFAF8", border: "1px dashed var(--line-strong)", borderRadius: 8, padding: 10 }}>
          <label style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer", marginBottom: fixo ? 10 : 0 }}>
            <input type="checkbox" style={{ width: "auto" }} checked={fixo} onChange={(e) => setFixo(e.target.checked)} />
            <span style={{ textTransform: "none", fontSize: 12.5, letterSpacing: 0 }}>Despesa fixa (repete todo mês)</span>
          </label>
          {fixo && (
            <>
              <label>Repetir por quantos meses</label>
              <select value={mesesFixo} onChange={(e) => setMesesFixo(e.target.value)}>
                {Array.from({ length: 60 }, (_, i) => i + 1).map((n) => <option key={n} value={n}>{n} {n === 1 ? "mês" : "meses"}</option>)}
              </select>
              <p style={{ fontSize: 11.5, color: "var(--ink-soft)", margin: "6px 0 0" }}>
                Será lançado o mesmo valor, todo mês, a partir da data informada.
              </p>
            </>
          )}
        </div>
      )}

      <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
        <button type="submit" className={`ltq-btn ${isReceita ? "ltq-btn-revenue" : "ltq-btn-expense"} ltq-btn-block`}>
          <IconPlus size={15} /> Lançar {isReceita ? "receita" : "despesa"}
        </button>
        <button type="button" className="ltq-btn ltq-btn-ghost" onClick={onCancel}>Fechar</button>
      </div>
    </form>
  );
}

function EntryLedger({ entries, onDelete, variant }) {
  const sorted = [...entries].sort((a, b) => (a.date < b.date ? 1 : -1));
  const total = entries.reduce((s, e) => s + e.value, 0);
  if (entries.length === 0) {
    return <EmptyState icon={<IconWallet size={26} />} text={variant === "revenue" ? "Nenhuma receita lançada ainda." : "Nenhuma despesa lançada ainda."} />;
  }
  return (
    <div className="ltq-ledger">
      {sorted.map((e) => (
        <div className="ltq-ledger-row" key={e.id}>
          <span className="ltq-ledger-date">{formatDatePt(e.date).slice(0, 5)}</span>
          <div className="ltq-ledger-main">
            <div className="ltq-ledger-desc">{e.description}</div>
            <div className="ltq-ledger-meta">
              {e.category} · {e.method}
              {e.parcela && <span style={{ color: "var(--gold)", fontWeight: 600 }}> · parcela {e.parcela.atual}/{e.parcela.total}</span>}
              {e.fixo && <span style={{ color: "var(--gold)", fontWeight: 600 }}> · fixo {e.fixo.atual}/{e.fixo.total}</span>}
            </div>
          </div>
          <span className="ltq-ledger-value" style={{ color: variant === "revenue" ? "var(--revenue)" : "var(--expense)" }}>
            {variant === "revenue" ? "+" : "-"}{formatBRL(e.value)}
          </span>
          <button className="ltq-ledger-del" onClick={() => onDelete(e.id, e.groupId)} aria-label="Excluir lançamento"><IconTrash size={15} /></button>
        </div>
      ))}
      <div className="ltq-ledger-total"><span>Total</span><span style={{ color: variant === "revenue" ? "var(--revenue)" : "var(--expense)" }}>{formatBRL(total)}</span></div>
    </div>
  );
}

function CategoryGroup({ title, items, onAdd, onRemove, placeholder }) {
  const [val, setVal] = useState("");
  function submit(e) {
    e.preventDefault();
    const v = val.trim();
    if (!v || items.includes(v)) return;
    onAdd(v); setVal("");
  }
  return (
    <div className="ltq-contas-group">
      <p className="ltq-contas-group-title">{title}</p>
      <div className="ltq-tag-list">
        {items.length === 0 && <span style={{ fontSize: 12.5, color: "var(--ink-soft)" }}>Nenhum item cadastrado.</span>}
        {items.map((item) => (
          <span className="ltq-tag" key={item}>{item}<button onClick={() => onRemove(item)} aria-label={`Remover ${item}`}><IconX size={11} /></button></span>
        ))}
      </div>
      <form className="ltq-addcat" onSubmit={submit}>
        <input type="text" placeholder={placeholder} value={val} onChange={(e) => setVal(e.target.value)} />
        <button type="submit" aria-label="Adicionar"><IconPlus size={16} /></button>
      </form>
    </div>
  );
}

/* ---------- sincronização entre aparelhos ---------- */
function SyncSettings({ config, sync }) {
  const [url, setUrl] = useState(config.url);
  const [code, setCode] = useState(config.code);

  function salvar(e) {
    e.preventDefault();
    config.setUrl(url.trim());
    config.setCode(code.trim());
  }

  const statusLabel = {
    off: "Desligada",
    syncing: "Sincronizando…",
    synced: "Sincronizado",
    error: "Erro ao sincronizar — confira o link e o código",
  }[sync.status];

  const statusColor = {
    off: "var(--ink-faint)",
    syncing: "var(--gold)",
    synced: "var(--revenue)",
    error: "var(--expense)",
  }[sync.status];

  return (
    <div className="ltq-contas-group">
      <p className="ltq-contas-group-title">Sincronização entre aparelhos</p>
      <p style={{ fontSize: 12, color: "var(--ink-soft)", margin: "0 0 12px", lineHeight: 1.5 }}>
        Configure o mesmo link e código em todos os aparelhos (celular, computador etc.) para que os lançamentos apareçam em todos automaticamente.
      </p>
      <form onSubmit={salvar} className="ltq-form" style={{ marginBottom: 10 }}>
        <div className="ltq-field">
          <label>Link do banco de dados (Firebase)</label>
          <input type="text" placeholder="https://seu-projeto-default-rtdb.firebaseio.com" value={url} onChange={(e) => setUrl(e.target.value)} />
        </div>
        <div className="ltq-field">
          <label>Código da sua conta</label>
          <input type="text" placeholder="Ex: familialopes2026" value={code} onChange={(e) => setCode(e.target.value)} />
        </div>
        <button type="submit" className="ltq-btn ltq-btn-gold ltq-btn-block">Salvar configuração</button>
      </form>
      {sync.enabled && (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, marginBottom: 8 }}>
          <span style={{ fontSize: 12.5, fontWeight: 600, color: statusColor }}>● {statusLabel}</span>
          <button type="button" className="ltq-btn ltq-btn-ghost" style={{ padding: "7px 12px", fontSize: 12 }} onClick={sync.syncNow}>Sincronizar agora</button>
        </div>
      )}
      {sync.lastSync && (
        <p style={{ fontSize: 11, color: "var(--ink-faint)", margin: "0 0 4px" }}>
          Última sincronização: {sync.lastSync.toLocaleTimeString("pt-BR")}
        </p>
      )}
      <p className="ltq-report-note">
        Use o mesmo código em todos os aparelhos — ele funciona como uma senha simples, então não compartilhe com quem não deve ver seus dados.
      </p>
    </div>
  );
}

/* ---------- aba de relatório em PDF ---------- */
function ReportTab({ data }) {
  const [tipo, setTipo] = useState("receitas");
  const [categoria, setCategoria] = useState("Todas");
  const [forma, setForma] = useState("Todas");
  const [mes, setMes] = useState("Todos");

  const categoriasDisponiveis = tipo === "receitas" ? data.categoriasReceita : data.categoriasDespesa;
  const formasDisponiveis = tipo === "receitas" ? data.formasRecebimento : data.formasPagamento;
  const entriesBase = tipo === "receitas" ? data.receitas : data.despesas;

  useEffect(() => { setCategoria("Todas"); setForma("Todas"); }, [tipo]);

  const filtradas = useMemo(() => {
    return entriesBase.filter((e) => {
      if (categoria !== "Todas" && e.category !== categoria) return false;
      if (forma !== "Todas" && e.method !== forma) return false;
      if (mes !== "Todos" && monthIndexFromISO(e.date) !== parseInt(mes, 10)) return false;
      return true;
    }).sort((a, b) => (a.date < b.date ? -1 : 1));
  }, [entriesBase, categoria, forma, mes]);

  const total = filtradas.reduce((s, e) => s + e.value, 0);

  function gerarPDF() {
    if (!window.jspdf) { alert("A biblioteca de PDF ainda está carregando. Tente novamente em alguns segundos."); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const tipoLabel = tipo === "receitas" ? "Receitas" : "Despesas";
    const corFaixa = tipo === "receitas" ? [47, 111, 94] : [166, 68, 61];

    doc.setFillColor(22, 33, 46);
    doc.rect(0, 0, 210, 28, "F");
    doc.setFillColor(...corFaixa);
    doc.rect(0, 28, 210, 2, "F");
    doc.setTextColor(255, 255, 255);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(16);
    doc.text("Controle Financeiro", 14, 14);
    doc.setFontSize(10.5);
    doc.setFont("helvetica", "normal");
    doc.text(`Relatório de ${tipoLabel} · Categoria: ${categoria} · Forma: ${forma} · Mês: ${mes === "Todos" ? "Todos" : MESES[parseInt(mes, 10)]}`, 14, 21);

    doc.setTextColor(30, 42, 56);
    doc.setFontSize(9);
    doc.text(`Gerado em ${new Date().toLocaleDateString("pt-BR")}`, 196, 36, { align: "right" });

    const rows = filtradas.map((e) => [
      formatDatePt(e.date),
      e.category,
      e.method,
      e.description,
      formatBRL(e.value),
    ]);

    doc.autoTable({
      startY: 40,
      head: [["Data", "Categoria", "Forma", "Descrição", "Valor"]],
      body: rows.length ? rows : [["-", "-", "-", "Nenhum lançamento no filtro selecionado", "-"]],
      headStyles: { fillColor: corFaixa, textColor: 255, fontStyle: "bold", fontSize: 9 },
      bodyStyles: { fontSize: 8.5, textColor: [30, 42, 56] },
      alternateRowStyles: { fillColor: [244, 245, 242] },
      columnStyles: { 4: { halign: "right" } },
      margin: { left: 14, right: 14 },
    });

    const finalY = doc.lastAutoTable.finalY || 40;
    doc.setFont("helvetica", "bold");
    doc.setFontSize(11);
    doc.setTextColor(...corFaixa);
    doc.text(`Total: ${formatBRL(total)}`, 196, finalY + 10, { align: "right" });

    const nomeArquivo = `Financeiro_${tipoLabel}_${categoria.replace(/\s+/g, "-")}_${forma.replace(/\s+/g, "-")}_${new Date().toISOString().slice(0,10)}.pdf`;
    doc.save(nomeArquivo);
  }

  return (
    <>
      <p className="ltq-section-label">Filtrar relatório</p>
      <div className="ltq-form" style={{ marginBottom: 16 }}>
        <div className="ltq-field">
          <label>Tipo de lançamento</label>
          <select value={tipo} onChange={(e) => setTipo(e.target.value)}>
            <option value="receitas">Receitas</option>
            <option value="despesas">Despesas</option>
          </select>
        </div>
        <div className="ltq-field">
          <label>Categoria</label>
          <select value={categoria} onChange={(e) => setCategoria(e.target.value)}>
            <option value="Todas">Todas as categorias</option>
            {categoriasDisponiveis.map((c) => <option key={c} value={c}>{c}</option>)}
          </select>
        </div>
        <div className="ltq-field">
          <label>{tipo === "receitas" ? "Forma de recebimento" : "Forma de pagamento"}</label>
          <select value={forma} onChange={(e) => setForma(e.target.value)}>
            <option value="Todas">Todas as formas</option>
            {formasDisponiveis.map((f) => <option key={f} value={f}>{f}</option>)}
          </select>
        </div>
        <div className="ltq-field">
          <label>Mês</label>
          <select value={mes} onChange={(e) => setMes(e.target.value)}>
            <option value="Todos">Todos os meses</option>
            {MESES.map((m, i) => <option key={m} value={i}>{m}</option>)}
          </select>
        </div>

        <div className="ltq-report-total">
          <span style={{ fontFamily: "Inter", fontWeight: 600, fontSize: 12.5 }}>{filtradas.length} lançamento(s)</span>
          <span>{formatBRL(total)}</span>
        </div>

        <button className="ltq-btn ltq-btn-gold ltq-btn-block" style={{ marginTop: 12 }} onClick={gerarPDF}>
          <IconFile size={15} /> Gerar relatório em PDF
        </button>
        <p className="ltq-report-note">O PDF é gerado no seu aparelho e baixado diretamente — nenhum dado é enviado para fora do app.</p>
      </div>

      <p className="ltq-section-label">Pré-visualização</p>
      <EntryLedger entries={filtradas} onDelete={() => {}} variant={tipo === "receitas" ? "revenue" : "expense"} />
    </>
  );
}

/* ---------- app principal ---------- */
function App() {
  const [data, setData, loaded] = useLtqData();
  const [tab, setTab] = useState("painel");
  const [showForm, setShowForm] = useState(false);
  const syncConfig = useSyncConfig();
  const sync = useCloudSync(data, setData, loaded, { url: syncConfig.url, code: syncConfig.code });

  const monthlyData = useMemo(() => MESES.map((mes, idx) => {
    const rec = data.receitas.filter((e) => monthIndexFromISO(e.date) === idx).reduce((s, e) => s + e.value, 0);
    const desp = data.despesas.filter((e) => monthIndexFromISO(e.date) === idx).reduce((s, e) => s + e.value, 0);
    return { mes, mesAbrev: MESES_ABREV[idx], receitas: rec, despesas: desp, lucro: rec - desp };
  }), [data.receitas, data.despesas]);

  const totalReceitas = useMemo(() => data.receitas.reduce((s, e) => s + e.value, 0), [data.receitas]);
  const totalDespesas = useMemo(() => data.despesas.reduce((s, e) => s + e.value, 0), [data.despesas]);
  const lucroTotal = totalReceitas - totalDespesas;

  function addEntry(tipo, base, opts) {
    if (opts && opts.parcelas) {
      const n = opts.parcelas;
      const groupId = uid();
      const cents = Math.round(base.value * 100);
      const each = Math.floor(cents / n);
      const resto = cents - each * n;
      const novas = Array.from({ length: n }, (_, i) => {
        const centsParcela = each + (i === n - 1 ? resto : 0);
        return {
          id: uid(),
          groupId,
          date: addMonthsISO(base.date, i),
          category: base.category,
          method: base.method,
          description: base.description,
          value: centsParcela / 100,
          parcela: { atual: i + 1, total: n },
        };
      });
      setData((d) => ({ ...d, [tipo]: [...d[tipo], ...novas] }));
    } else if (opts && opts.fixo) {
      const n = opts.fixo;
      const groupId = uid();
      const novas = Array.from({ length: n }, (_, i) => ({
        id: uid(),
        groupId,
        date: addMonthsISO(base.date, i),
        category: base.category,
        method: base.method,
        description: base.description,
        value: base.value,
        fixo: { atual: i + 1, total: n },
      }));
      setData((d) => ({ ...d, [tipo]: [...d[tipo], ...novas] }));
    } else {
      setData((d) => ({ ...d, [tipo]: [...d[tipo], { id: uid(), ...base }] }));
    }
  }
  function deleteEntry(tipo, id, groupId) {
    if (groupId) {
      const excluirGrupo = window.confirm(
        "Este lançamento faz parte de um parcelamento ou despesa fixa.\n\nOK = excluir TODOS os lançamentos desse grupo (todas as parcelas/meses).\nCancelar = excluir apenas este lançamento."
      );
      if (excluirGrupo) {
        setData((d) => ({ ...d, [tipo]: d[tipo].filter((e) => e.groupId !== groupId) }));
        return;
      }
    }
    setData((d) => ({ ...d, [tipo]: d[tipo].filter((e) => e.id !== id) }));
  }
  function addCategoria(key, value) { setData((d) => ({ ...d, [key]: [...d[key], value] })); }
  function removeCategoria(key, value) { setData((d) => ({ ...d, [key]: d[key].filter((c) => c !== value) })); }

  function categoryBreakdown(entries) {
    const map = {};
    entries.forEach((e) => { map[e.category] = (map[e.category] || 0) + e.value; });
    return Object.entries(map).map(([k, v]) => ({ label: k, value: v })).sort((a, b) => b.value - a.value);
  }
  const receitaBreakdown = useMemo(() => categoryBreakdown(data.receitas), [data.receitas]);
  const despesaBreakdown = useMemo(() => categoryBreakdown(data.despesas), [data.despesas]);
  const formaBreakdown = useMemo(() => {
    const map = {};
    data.receitas.forEach((e) => { map[e.method] = (map[e.method] || 0) + e.value; });
    return Object.entries(map).map(([k, v]) => ({ label: k, value: v })).sort((a, b) => b.value - a.value);
  }, [data.receitas]);

  if (!loaded) {
    return <div className="ltq-app" style={{ alignItems: "center", justifyContent: "center", display: "flex" }}>
      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: "#64748A" }}>Carregando livro-razão…</span>
    </div>;
  }

  return (
    <div className="ltq-app">
      <div className="ltq-header">
        <p className="ltq-header-eyebrow">Controle Financeiro</p>
        <p className="ltq-header-title">
          {tab === "painel" && "Painel Principal"}
          {tab === "receitas" && "Lançar Receitas"}
          {tab === "despesas" && "Lançar Despesas"}
          {tab === "resumo" && "Resumo Mensal"}
          {tab === "relatorio" && "Relatório em PDF"}
          {tab === "contas" && "Plano de Contas"}
        </p>
      </div>

      <div className="ltq-content">
        {tab === "painel" && (
          <>
            <p className="ltq-section-label">Totais gerais</p>
            <div className="ltq-cards-row">
              <Card label="Receitas" value={totalReceitas} variant="revenue" />
              <Card label="Gastos" value={totalDespesas} variant="expense" />
              <Card label="Lucro / Prejuízo" value={lucroTotal} variant="profit" />
              <div className="ltq-card" style={{ borderTop: "3px solid var(--ink-faint)", display: "flex", flexDirection: "column", justifyContent: "center" }}>
                <p className="ltq-card-label" style={{ marginBottom: 2 }}>Lançamentos</p>
                <p className="ltq-card-value" style={{ fontSize: 21 }}>{data.receitas.length + data.despesas.length}</p>
              </div>
            </div>

            <p className="ltq-section-label">Desempenho mensal</p>
            <div className="ltq-chart-card">
              <p className="ltq-chart-title">Receitas × Despesas</p>
              <div className="ltq-chart-legend">
                <span><span className="ltq-legend-dot" style={{ background: "#2F6F5E" }} />Receitas</span>
                <span><span className="ltq-legend-dot" style={{ background: "#A6443D" }} />Despesas</span>
              </div>
              <MonthlyBarChart data={monthlyData} />
            </div>

            <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
              <button className="ltq-btn ltq-btn-revenue ltq-btn-block" onClick={() => { setTab("receitas"); setShowForm(true); }}><IconPlus size={15} /> Receita</button>
              <button className="ltq-btn ltq-btn-expense ltq-btn-block" onClick={() => { setTab("despesas"); setShowForm(true); }}><IconPlus size={15} /> Despesa</button>
            </div>
            <button className="ltq-btn ltq-btn-ghost ltq-btn-block" onClick={() => setTab("relatorio")}><IconFile size={15} /> Gerar relatório em PDF</button>
          </>
        )}

        {tab === "receitas" && (
          <>
            {!showForm && <button className="ltq-btn ltq-btn-revenue ltq-btn-block" style={{ marginBottom: 16 }} onClick={() => setShowForm(true)}><IconPlus size={15} /> Nova receita</button>}
            {showForm && <EntryForm tipo="receita" categorias={data.categoriasReceita} formas={data.formasRecebimento}
              onSubmit={(entry, opts) => { addEntry("receitas", entry, opts); setShowForm(false); }} onCancel={() => setShowForm(false)} />}
            <p className="ltq-section-label">Lançamentos</p>
            <EntryLedger entries={data.receitas} onDelete={(id, groupId) => deleteEntry("receitas", id, groupId)} variant="revenue" />
          </>
        )}

        {tab === "despesas" && (
          <>
            {!showForm && <button className="ltq-btn ltq-btn-expense ltq-btn-block" style={{ marginBottom: 16 }} onClick={() => setShowForm(true)}><IconPlus size={15} /> Nova despesa</button>}
            {showForm && <EntryForm tipo="despesa" categorias={data.categoriasDespesa} formas={data.formasPagamento}
              onSubmit={(entry, opts) => { addEntry("despesas", entry, opts); setShowForm(false); }} onCancel={() => setShowForm(false)} />}
            <p className="ltq-section-label">Lançamentos</p>
            <EntryLedger entries={data.despesas} onDelete={(id, groupId) => deleteEntry("despesas", id, groupId)} variant="expense" />
          </>
        )}

        {tab === "resumo" && (
          <>
            <p className="ltq-section-label">Receitas × despesas por mês</p>
            <div className="ltq-chart-card" style={{ padding: "10px 4px 4px" }}>
              <table className="ltq-resumo-table">
                <thead><tr><th>Mês</th><th>Receitas</th><th>Despesas</th><th>Lucro</th></tr></thead>
                <tbody>
                  {monthlyData.map((m) => (
                    <tr key={m.mes}>
                      <td>{m.mes}</td>
                      <td className="col-rev">{formatBRL(m.receitas)}</td>
                      <td className="col-exp">{formatBRL(m.despesas)}</td>
                      <td style={{ color: m.lucro >= 0 ? "var(--revenue)" : "var(--expense)" }}>{formatBRL(m.lucro)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            <p className="ltq-section-label">Por categoria de receita</p>
            <div className="ltq-chart-card">
              {receitaBreakdown.length === 0 ? <span style={{ fontSize: 12.5, color: "var(--ink-soft)" }}>Sem lançamentos ainda.</span> :
                receitaBreakdown.map((b) => (
                  <div className="ltq-breakdown-row" key={b.label}>
                    <span className="ltq-breakdown-label">{b.label}</span>
                    <div className="ltq-breakdown-bar-track"><div className="ltq-breakdown-bar-fill" style={{ width: `${totalReceitas ? (b.value/totalReceitas)*100 : 0}%`, background: "var(--revenue)" }} /></div>
                    <span className="ltq-breakdown-value">{formatBRL(b.value)}</span>
                  </div>
                ))}
            </div>

            <p className="ltq-section-label">Por categoria de despesa</p>
            <div className="ltq-chart-card">
              {despesaBreakdown.length === 0 ? <span style={{ fontSize: 12.5, color: "var(--ink-soft)" }}>Sem lançamentos ainda.</span> :
                despesaBreakdown.map((b) => (
                  <div className="ltq-breakdown-row" key={b.label}>
                    <span className="ltq-breakdown-label">{b.label}</span>
                    <div className="ltq-breakdown-bar-track"><div className="ltq-breakdown-bar-fill" style={{ width: `${totalDespesas ? (b.value/totalDespesas)*100 : 0}%`, background: "var(--expense)" }} /></div>
                    <span className="ltq-breakdown-value">{formatBRL(b.value)}</span>
                  </div>
                ))}
            </div>

            <p className="ltq-section-label">Por forma de recebimento</p>
            <div className="ltq-chart-card">
              {formaBreakdown.length === 0 ? <span style={{ fontSize: 12.5, color: "var(--ink-soft)" }}>Sem lançamentos ainda.</span> :
                formaBreakdown.map((b) => (
                  <div className="ltq-breakdown-row" key={b.label}>
                    <span className="ltq-breakdown-label">{b.label}</span>
                    <div className="ltq-breakdown-bar-track"><div className="ltq-breakdown-bar-fill" style={{ width: `${totalReceitas ? (b.value/totalReceitas)*100 : 0}%`, background: "var(--gold)" }} /></div>
                    <span className="ltq-breakdown-value">{formatBRL(b.value)}</span>
                  </div>
                ))}
            </div>
          </>
        )}

        {tab === "relatorio" && <ReportTab data={data} />}

        {tab === "contas" && (
          <>
            <SyncSettings config={syncConfig} sync={sync} />
            <p className="ltq-section-label">Cadastro de categorias e formas</p>
            <CategoryGroup title="Categorias de receita" items={data.categoriasReceita}
              onAdd={(v) => addCategoria("categoriasReceita", v)} onRemove={(v) => removeCategoria("categoriasReceita", v)} placeholder="Nova categoria de receita" />
            <CategoryGroup title="Categorias de despesa" items={data.categoriasDespesa}
              onAdd={(v) => addCategoria("categoriasDespesa", v)} onRemove={(v) => removeCategoria("categoriasDespesa", v)} placeholder="Nova categoria de despesa" />
            <CategoryGroup title="Formas de recebimento" items={data.formasRecebimento}
              onAdd={(v) => addCategoria("formasRecebimento", v)} onRemove={(v) => removeCategoria("formasRecebimento", v)} placeholder="Nova forma de recebimento" />
            <CategoryGroup title="Formas de pagamento" items={data.formasPagamento}
              onAdd={(v) => addCategoria("formasPagamento", v)} onRemove={(v) => removeCategoria("formasPagamento", v)} placeholder="Nova forma de pagamento" />
          </>
        )}
      </div>

      <div className="ltq-bottomnav">
        {[
          { id: "painel", label: "Painel", Icon: IconDashboard },
          { id: "receitas", label: "Receitas", Icon: IconUp },
          { id: "despesas", label: "Despesas", Icon: IconDown },
          { id: "resumo", label: "Resumo", Icon: IconBars },
          { id: "relatorio", label: "PDF", Icon: IconFile },
          { id: "contas", label: "Contas", Icon: IconBook },
        ].map(({ id, label, Icon: TabIcon }) => (
          <button key={id} className={`ltq-navtab ${tab === id ? "ltq-navtab-active" : ""}`} onClick={() => { setTab(id); setShowForm(false); }}>
            <TabIcon size={18} />{label}
          </button>
        ))}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>
